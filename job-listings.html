<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaziConnect | Browse AI-Matched Jobs</title>

    <!-- Fonts: Outfit (Display) & Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              green: '#1A5C32',
              amber: '#F05A28',
              dark: '#0D2B17',
              light: '#F4F7F5'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-brand-light text-gray-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- NAVIGATION BAR -->
  <nav class="bg-brand-green text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="index.html" class="flex items-center space-x-2">
          <div class="bg-brand-amber text-white p-1.5 rounded-lg">
            <i data-lucide="briefcase" class="w-5 h-5"></i>
          </div>
          <span class="font-display font-bold text-xl tracking-tight">KaziConnect</span>
        </a>
        <span class="bg-white/10 text-emerald-200 text-xs px-2.5 py-1 rounded-full font-medium ml-2">Job Opportunities</span>
      </div>

      <div class="flex items-center space-x-4">
        <a href="job-seeker-dashboard.html" class="text-xs font-semibold hover:text-emerald-200 transition">My Dashboard</a>
        <div class="flex items-center space-x-3 border-l border-white/20 pl-4">
          <div class="w-8 h-8 bg-brand-amber rounded-full flex items-center justify-center font-bold text-xs text-white">
            BO
          </div>
          <span class="hidden sm:inline text-xs font-medium">Barbara Okere</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- HERO SEARCH HEADER -->
  <header class="bg-brand-dark text-white py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto">
      <h1 class="font-display font-extrabold text-2xl sm:text-3xl text-white mb-2">Find AI-Matched Opportunities</h1>
      <p class="text-emerald-200 text-sm max-w-xl mb-6">Explore roles aligned with your verified skills across Kenya’s top innovation, financial, and tech sectors.</p>
      
      <!-- SEARCH & FILTER BAR -->
      <div class="bg-white p-3 rounded-2xl shadow-xl flex flex-col md:flex-row gap-3 text-gray-800">
        <div class="relative flex-grow">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3.5 text-gray-400"></i>
          <input type="text" id="searchInput" onkeyup="filterJobs()" placeholder="Search title, skills, or employer..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-brand-green">
        </div>
        <div class="relative w-full md:w-56">
          <i data-lucide="map-pin" class="w-4 h-4 absolute left-3.5 top-3.5 text-gray-400"></i>
          <select id="locationSelect" onchange="filterJobs()" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-brand-green bg-white text-gray-700">
            <option value="">All Locations</option>
            <option value="Nairobi">Nairobi</option>
            <option value="Mombasa">Mombasa</option>
            <option value="Kisumu">Kisumu</option>
            <option value="Eldoret">Eldoret</option>
            <option value="Remote">Remote</option>
          </select>
        </div>
        <button class="bg-brand-amber hover:bg-opacity-90 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition flex items-center justify-center space-x-2">
          <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
          <span>Filter</span>
        </button>
      </div>

      <!-- SECTOR CHIPS -->
      <div class="flex items-center space-x-2 mt-4 overflow-x-auto pb-2 scrollbar-none text-xs">
        <span class="text-emerald-300 font-semibold uppercase tracking-wider text-[11px] mr-2">Sectors:</span>
        <button onclick="filterSector('All')" class="sector-chip bg-brand-amber text-white font-semibold px-3.5 py-1.5 rounded-full transition whitespace-nowrap">All Sectors</button>
        <button onclick="filterSector('Technology')" class="sector-chip bg-white/10 hover:bg-white/20 text-emerald-100 font-medium px-3.5 py-1.5 rounded-full transition whitespace-nowrap">Technology</button>
        <button onclick="filterSector('Finance')" class="sector-chip bg-white/10 hover:bg-white/20 text-emerald-100 font-medium px-3.5 py-1.5 rounded-full transition whitespace-nowrap">Finance</button>
        <button onclick="filterSector('Digital Marketing')" class="sector-chip bg-white/10 hover:bg-white/20 text-emerald-100 font-medium px-3.5 py-1.5 rounded-full transition whitespace-nowrap">Digital Marketing</button>
        <button onclick="filterSector('Agribusiness')" class="sector-chip bg-white/10 hover:bg-white/20 text-emerald-100 font-medium px-3.5 py-1.5 rounded-full transition whitespace-nowrap">Agribusiness</button>
      </div>
    </div>
  </header>

  <!-- MAIN LISTINGS CONTENT -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
    
    <!-- RESULTS BAR -->
    <div class="flex justify-between items-center mb-6">
      <p class="text-xs text-gray-500 font-medium">Showing <span id="resultsCount" class="font-bold text-gray-900">4</span> verified opportunities</p>
      <div class="flex items-center space-x-2 text-xs">
        <span class="text-gray-500">Sort by:</span>
        <select onchange="sortJobs(this.value)" class="border border-gray-200 rounded-lg px-2.5 py-1.5 bg-white font-medium focus:outline-none focus:border-brand-green">
          <option value="match">Highest AI Match</option>
          <option value="recent">Most Recent</option>
          <option value="alpha">Alphabetical</option>
        </select>
      </div>
    </div>
</head>
<body>
    
</body>
</html>
